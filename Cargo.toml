[package]
name = "shardgate"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "shard_bench"
harness = false
